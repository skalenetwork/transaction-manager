[project]
name = "transaction-manager"
version = "3.1.0"
requires-python = ">=3.13"
dependencies = ["skale.py==7.5dev1", "statsd==4.0.1"]

[project.optional-dependencies]
dev = ["ruff==0.14.0", "mypy==1.18.2"]
test = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "freezegun==1.5.5",
    "codecov==2.1.13",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
ignore_missing_imports = true
# todo: uncomment when types are added to all modules
# warn_return_any = true
# disallow_untyped_defs = true
