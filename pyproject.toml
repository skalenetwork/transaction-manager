[project]
name = "transaction-manager"
version = "3.3.0"
requires-python = ">=3.14"
dependencies = ["skale.py==8.0dev0", "statsd==4.0.1"]

[project.optional-dependencies]
dev = ["ruff==0.17.3", "mypy==2.4.0"]
test = ["pytest==9.2.0", "pytest-cov==7.1.0"]

[tool.ruff]
line-length = 100
extend-exclude = ["helper-scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.14"
warn_unused_configs = true
ignore_missing_imports = true
# todo: uncomment when types are added to all modules
# warn_return_any = true
# disallow_untyped_defs = true
