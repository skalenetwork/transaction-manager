name: Build and publish
on:
  pull_request:
    types: [closed]
    branches:
      - develop
      - beta
      - stable

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    if: github.event.pull_request.merged
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Build and publish container
        run: |
          export BRANCH=${GITHUB_REF##*/}
          export VERSION=$(grep '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "Branch: $BRANCH"
          echo "Base version: $VERSION"
          export VERSION=$(bash ./helper-scripts/calculate_version.sh)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version $VERSION"
          export CONTAINER_NAME="transaction-manager"
          bash ./helper-scripts/build_and_publish.sh
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.VERSION }}
          prerelease: ${{ github.base_ref != 'stable' }}
